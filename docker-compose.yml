name: signal-jackbox

services:
  redis:
    image: redis:7.4-alpine
    container_name: signal_redis_cache
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:17-alpine
    container_name: signal_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: signal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"

  dbx:
      image: t8y2/dbx:latest
      pull_policy: always
      ports:
        - "4224:4224"
      volumes:
        - dbx-data:/app/data
      restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  dbx-data:
